# Fluentd Configuration for Gatekeeper RPA
# Centralized logging with security filtering and structured output

# System configuration
<system>
  log_level info
  workers 2
</system>

# Input sources
<source>
  @type tail
  path /fluentd/log/app/*.log
  pos_file /fluentd/log/app/app.log.pos
  tag app.*
  format json
  time_format %Y-%m-%dT%H:%M:%S.%L%z
</source>

<source>
  @type tail
  path /fluentd/log/nginx/*.log
  pos_file /fluentd/log/nginx/nginx.log.pos
  tag nginx.*
  format /^(?<remote_addr>[^ ]+) - (?<remote_user>[^ ]+) \[(?<time_local>[^\]]+)\] "(?<method>[^ ]+) (?<request>[^ ]+) (?<protocol>[^ ]+)" (?<status>[^ ]+) (?<body_bytes_sent>[^ ]+) "(?<http_referer>[^"]*)" "(?<http_user_agent>[^"]*)"$/
  time_format %d/%b/%Y:%H:%M:%S %z
</source>

<source>
  @type tail
  path /fluentd/log/rpa/*.log
  pos_file /fluentd/log/rpa/rpa.log.pos
  tag rpa.*
  format json
  time_format %Y-%m-%dT%H:%M:%S.%L%z
</source>

# Docker logging
<source>
  @type docker
  tag docker.*
  format json
  time_key time
</source>

# Security event filtering
<filter app.**>
  @type grep
  <exclude>
    key level
    pattern ^debug$
  </exclude>
</filter>

<filter app.**>
  @type grep
  <regexp>
    key message
    pattern /password|secret|token|key/i
  </regexp>
  <replace>
    key message
    pattern /(password|secret|token|key)\s*[:=]\s*[^\s]+/i
    replace $1 [REDACTED]
  </replace>
</filter>

# Enrichment pipeline
<filter app.**>
  @type record_transformer
  <record>
    environment ${ENVIRONMENT:-development}
    service ${SERVICE_NAME:-gatekeeper-rpa}
    version ${APP_VERSION:-1.0.0}
    host "#{Socket.gethostname}"
  </record>
</filter>

<filter nginx.**>
  @type record_transformer
  <record>
    environment ${ENVIRONMENT:-development}
    service ${SERVICE_NAME:-gatekeeper-rpa}
    version ${APP_VERSION:-1.0.0}
    host "#{Socket.gethostname}"
  </record>
</filter>

<filter rpa.**>
  @type record_transformer
  <record>
    environment ${ENVIRONMENT:-development}
    service ${SERVICE_NAME:-gatekeeper-rpa}
    version ${APP_VERSION:-1.0.0}
    host "#{Socket.gethostname}"
  </record>
</filter>

# Security event tagging
<filter app.**>
  @type grep
  <regexp>
    key level
    pattern ^(error|warn)$
  </regexp>
  <tag>
    security_event
  </tag>
</filter>

<filter app.**>
  @type grep
  <regexp>
    key message
    pattern /(authentication|authorization|security|failed|blocked)/i
  </regexp>
  <tag>
    security_alert
  </tag>
</filter>

# Business event tagging
<filter app.**>
  @type grep
  <regexp>
    key message
    pattern /(audit|ticket|whatsapp|rpa|1map|automation)/i
  </regexp>
  <tag>
    business_event
  </tag>
</filter>

# Buffer configuration for performance
<match app.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name gatekeeper-rpa-app-#{Time.strftime('%Y.%m.%d')}
  type_name _doc
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
  <buffer>
    flush_mode interval
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_times 3
    chunk_limit_size 2MB
    queue_limit_length 32
    overflow_action block
  </buffer>
</match>

