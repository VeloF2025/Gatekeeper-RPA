# Gatekeeper RPA Nginx Security Configuration
# Enhanced security rules for Zero Trust implementation

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

# Prevent MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Enable XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Enforce HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Control browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Remove server information
server_tokens off;

# Disable unnecessary methods
if ($request_method !~ ^(GET|HEAD|POST)$ ) {
    return 405;
}

# Block access to sensitive files
location ~* \.(env|log|conf|key|pem|p12|pfx)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to development files
location ~* \.(bak|old|orig|backup|tmp|temp|cache)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to version control directories
location ~* /\.(git|svn|hg)/ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block access to hidden files
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block common attack patterns
location ~* \.(php|jsp|cgi|pl|py|sh|asp)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block SQL injection attempts
location ~* union.*select.*\( {
    deny all;
    access_log off;
    log_not_found off;
}

# Block file inclusion attempts
location ~* [a-zA-Z0-9_]=http:// {
    deny all;
    access_log off;
    log_not_found off;
}

# Block XSS attempts
location ~* <script.*>.*</script> {
    deny all;
    access_log off;
    log_not_found off;
}

# Block directory traversal attempts
location ~* \.\./ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block null bytes
location ~* "%00" {
    deny all;
    access_log off;
    log_not_found off;
}

# Rate limiting for sensitive endpoints
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

# Apply rate limiting to authentication endpoints
location ~* /auth/ {
    limit_req zone=auth burst=3 nodelay;
}

# Apply rate limiting to sensitive API endpoints
location ~* /api/(admin|config|users)/ {
    limit_req zone=sensitive burst=5 nodelay;
}

# IP whitelisting for admin endpoints (optional)
# allow 192.168.1.0/24;
# deny all;

# Bot blocking
map $http_user_agent $bad_bot {
    default 0;
    ~*(bot|crawler|spider|scraper|harvest|extractor|grabber|sucker|ninja|clshttp|archiver|loader|grab|download|curl|wget) 1;
}

# Block bad bots
if ($bad_bot) {
    return 403;
}

# Block suspicious referrers
map $http_referer $bad_referer {
    default 0;
    ~*(semalt|best-seo|o-o-8-o-o|darodar|buttons-for-website|simple-share-buttons|4webmasters|econom|ranksonic|siteexplorer) 1;
}

# Block bad referrers
if ($bad_referer) {
    return 403;
}

# Security logging
log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'security_block="$security_block" '
                    'security_reason="$security_reason"';

# Security events log
access_log /var/log/nginx/security.log security;

# Real-time security monitoring
location = /security-monitoring {
    access_log /var/log/nginx/security-monitoring.log;
    return 200 '{"status":"monitoring","timestamp":"$time_iso8601"}';
}

# Web Application Firewall (WAF) rules
location ~* \.(exe|bat|cmd|sh|php|jsp|cgi|pl|py)$ {
    deny all;
    access_log /var/log/nginx/waf.log;
}

# Block common attack patterns
location ~* (delete|drop|insert|select|update|union|exec|script|alert|onclick|onload|eval|javascript) {
    deny all;
    access_log /var/log/nginx/waf.log;
}

# Block file upload attacks
location ~* \.(php|phtml|php3|php4|php5|pl|py|jsp|asp|sh|cgi)$ {
    deny all;
    access_log /var/log/nginx/waf.log;
}

# SSL/TLS security hardening
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/ssl/ca-bundle.crt;

# HSTS preload
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;