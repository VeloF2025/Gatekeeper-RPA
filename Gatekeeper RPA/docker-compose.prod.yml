# Gatekeeper RPA Production Docker Compose
# Enhanced security and scalability for production deployment

version: '3.8'

services:
  # Production PostgreSQL with high availability
  postgres:
    image: postgres:15-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements -c max_connections=500 -c wal_level=replica -c max_wal_senders=3 -c max_replication_slots=3
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
      placement:
        constraints:
          - node.role == manager
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_max_syn_backlog=1024

  # Production Redis with persistence and security
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Production Next.js Application
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      ONEMAP_USERNAME: ${ONEMAP_USERNAME}
      ONEMAP_PASSWORD: ${ONEMAP_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - nextjs_logs:/app/logs
      - nextjs_uploads:/app/uploads
      - nextjs_public:/app/public
    ports:
      - "3020:3020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: ${NEXTJS_REPLICAS:-3}
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first

  # Production Nginx with SSL and security
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./nginx/security.prod.conf:/etc/nginx/security.conf
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - nextjs_uploads:/var/www/uploads
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextjs
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Production RPA Workers
  rpa-workers:
    build:
      context: .
      dockerfile: docker/rpa.Dockerfile
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-10}
      MAX_CONCURRENT_AUDITS: ${MAX_CONCURRENT_AUDITS:-5}
      ONEMAP_USERNAME: ${ONEMAP_USERNAME}
      ONEMAP_PASSWORD: ${ONEMAP_PASSWORD}
      SCREENSHOT_PATH: /app/screenshots
      PHOTO_PATH: /app/photos
    volumes:
      - rpa_screenshots:/app/screenshots
      - rpa_photos:/app/photos
      - rpa_logs:/app/logs
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 60s
      timeout: 30s
      retries: 3
    deploy:
      replicas: ${RPA_REPLICAS:-5}
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 2G
          cpus: '2.0'

  # Production Queue Worker
  queue-worker:
    build:
      context: .
      dockerfile: docker/queue.Dockerfile
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatekeeper-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: ${QUEUE_REPLICAS:-3}
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Production Monitoring Stack
  prometheus:
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.size=50GB'
    volumes:
      - ./monitoring/prometheus.prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gatekeeper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_SECURITY_ALLOW_EMBEDDING: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    networks:
      - gatekeeper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Production Security Services
  fail2ban:
    image: crazymax/fail2ban:latest
    volumes:
      - ./fail2ban/jail.prod.local:/etc/fail2ban/jail.local
      - ./fail2ban/filter.d:/etc/fail2ban/filter.d
      - nginx_logs:/var/log/nginx:ro
      - nextjs_logs:/var/log/app:ro
    network_mode: host
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  fluentd:
    image: fluent/fluentd:v1.16-1
    volumes:
      - ./logging/fluentd.prod.conf:/fluentd/etc/fluent.conf
      - nextjs_logs:/fluentd/log/app
      - nginx_logs:/fluentd/log/nginx
      - rpa_logs:/fluentd/log/rpa
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - gatekeeper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nextjs_logs:
    driver: local
  nextjs_uploads:
    driver: local
  nextjs_public:
    driver: local
  rpa_screenshots:
    driver: local
  rpa_photos:
    driver: local
  rpa_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  gatekeeper-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
    driver_opts:
      com.docker.network.bridge.name: gatekeeper-prod