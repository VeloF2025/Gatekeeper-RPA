# Global configuration for all agents
global_config:
  # Quality enforcement settings
  quality_enforcement:
    enabled: true
    strict_mode: true
    auto_fix: false
    blocking_validation: true

  # Performance requirements
  performance_requirements:
    max_memory_usage: "200MB"
    max_battery_usage: "3% per hour"
    max_startup_time: "2 seconds"
    max_inference_latency: "500ms"
    min_ui_fps: "60"

  # Security requirements
  security_requirements:
    encryption_required: true
    biometric_auth_required: true
    certificate_pinning_required: true
    secure_storage_required: true

  # Testing requirements
  testing_requirements:
