# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.disableAutomaticComponentCreation=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx2048m

# Enable new incremental annotation processing
kapt.incremental.apt=true
kapt.use.worker.api=true

# Compose
android.defaults.buildfeatures.compose=true

# Performance optimizations
android.enableR8.fullMode=true
android.enableDexingArtifactTransform=true

# Test optimization
android.testOptions.hostTests.coverage=true
android.testOptions.unitTests.isIncludeAndroidResources=true

# Build cache
org.gradle.caching=true
org.gradle.build-cache=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Enable parallel builds
org.gradle.parallel=true

# Enable new incremental compilation
android.experimental.enableNewIncrementalCompilation=true