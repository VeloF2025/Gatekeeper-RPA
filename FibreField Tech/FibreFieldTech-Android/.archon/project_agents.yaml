# FibreField Tech Android App - Project-Specific Agents Configuration
# Generated: 2025-09-16
# Project Complexity: 9/10 (Very Complex with AI/ML Integration)

project:
  name: "FibreField Tech Android"
  type: "android-app"
  complexity_score: 9
  description: "Fiber optic installation technician app with AI/ML capabilities"
  technologies:
    - "Android SDK (minSdk 24, targetSdk 35)"
    - "Jetpack Compose"
    - "Material Design 3"
    - "Hilt Dependency Injection"
    - "Room Database with SQLCipher"
    - "TensorFlow Lite (Phi-3.5 Mini LLM)"
    - "CameraX"
    - "WorkManager"
    - "Biometric Authentication"
    - "ML Kit"
    - "Kotlin Coroutines"
    - "Firebase"
  architecture_patterns:
    - "Clean Architecture"
    - "MVVM"
    - "Repository Pattern"
    - "Dependency Injection"
    - "Offline-First"
    - "AI/ML Integration"

specialized_agents:
  # Android Compose + AI Integration Specialist
  - name: "android-compose-ai-specialist"
    activation_command: "@android-compose-ai"
    description: "Expert in Jetpack Compose UI development with AI/ML integration"
    skills:
      - "Jetpack Compose with Material 3"
      - "AI/ML model integration in Android"
      - "Phi-3.5 Mini LLM implementation"
      - "Reactive UI patterns with StateFlow"
      - "Custom Composables for high-tech UI"
      - "Animation and transitions"
      - "Accessibility in Compose"
    quality_gates:
      - "Zero Android compilation errors"
      - "100% Compose best practices"
      - "AI model optimization for mobile"
      - "Memory efficiency in Compose"
      - "60fps UI rendering"
    validation_rules:
      - "Validate AI model initialization"
      - "Check Compose performance"
      - "Verify ML inference on main thread"
      - "Ensure proper state management"
      - "Accessibility compliance"

  # ML & Computer Vision Architect
  - name: "ml-computer-vision-architect"
    activation_command: "@ml-cv-architect"
    description: "Computer vision and ML model optimization specialist"
    skills:
      - "TensorFlow Lite optimization"
      - "ONNX model conversion"
      - "CameraX + ML Kit integration"
      - "ONT light detection algorithms"
      - "Model quantization and pruning"
      - "Real-time inference optimization"
      - "Edge AI deployment"
    quality_gates:
      - "ML inference <100ms"
      - "Model size <50MB"
      - "Accuracy >95% for detection"
      - "Battery impact <5% per inference"
      - "Memory usage <100MB for ML"
    validation_rules:
      - "Validate model performance"
      - "Check camera integration"
      - "Verify ONT detection accuracy"
      - "Ensure thread safety"
      - "Model version management"

  # Offline-First Database Expert
  - name: "offline-first-database-expert"
    activation_command: "@offline-db-expert"
    description: "Room database with synchronization patterns specialist"
    skills:
      - "Room with SQLCipher encryption"
      - "Offline-first architecture"
      - "Conflict resolution strategies"
      - "Data synchronization algorithms"
      - "Database indexing optimization"
      - "Data migration strategies"
      - "Paging 3 implementation"
    quality_gates:
      - "Database queries <50ms"
      - "Sync efficiency >99%"
      - "Data integrity guaranteed"
      - "Encryption at rest"
      - "Zero data loss scenarios"
    validation_rules:
      - "Validate database schema"
      - "Check sync conflicts"
      - "Verify encryption"
      - "Ensure backup/restore"
      - "Performance testing"

  # Camera Workflow Engineer
  - name: "camera-workflow-engineer"
    activation_command: "@camera-workflow"
    description: "9-step photo capture workflow specialist"
    skills:
      - "CameraX advanced features"
      - "Multi-step workflow state management"
      - "Image processing and compression"
      - "Geotagging and metadata"
      - "Quality assurance automation"
      - "Error handling in camera flow"
      - "Progress indicators"
    quality_gates:
      - "Capture time <2s per photo"
      - "Image quality validation"
      - "Workflow completion rate >98%"
      - "GPS accuracy <5m"
      - "Storage optimization"
    validation_rules:
      - "Validate camera permissions"
      - "Check image quality"
      - "Verify workflow states"
      - "Ensure error recovery"
      - "Storage management"

  # Material You High-Tech UI Designer
  - name: "material-you-high-tech-ui-designer"
    activation_command: "@high-tech-ui"
    description: "Futuristic UI/UX specialist for field technician apps"
    skills:
      - "Material You dynamic theming"
      - "High-tech visual design"
      - "Dark mode optimization"
      - "Responsive layouts for tablets"
      - "Custom animations and transitions"
      - "Accessibility (WCAG 2.1)"
