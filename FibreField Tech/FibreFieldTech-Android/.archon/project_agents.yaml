      - "Ensure animations performant"
      - "Accessibility testing"

  # Android Performance Optimization Expert
  - name: "android-performance-optimization-expert"
    activation_command: "@android-perf"
    description: "Memory and battery optimization specialist"
    skills:
      - "Memory leak detection"
      - "Battery optimization techniques"
      - "Background task optimization"
      - "App startup time reduction"
      - "Network request optimization"
      - "UI performance profiling"
      - "Thermal management"
    quality_gates:
      - "App startup <1.5s"
      - "Memory usage <500MB peak"
      - "Battery impact <15%/hour"
