      - "Session timeout enforcement"
      - "Security audit passed"
    validation_rules:
      - "Validate encryption"
      - "Check authentication flows"
      - "Verify secure storage"
      - "Ensure network security"
      - "Penetration testing"

  # Android Testing Specialist
  - name: "android-testing-specialist"
