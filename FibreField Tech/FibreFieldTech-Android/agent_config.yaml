# FibreField Tech Android App - Agent Configuration
# Configuration for 8 specialized AI agents

agents:
  # 1. Material You High-Tech UI Designer
  - name: material-you-high-tech-ui-designer
    type: ui_ux_designer
    description: "Specializes in Material You design, high-tech aesthetics, and accessibility"
    capabilities:
      - jetpack_compose
      - material_design_3
      - accessibility_wcag
      - ui_animations
      - responsive_design
      - dark_theme_optimization
      - glass_morphism_effects
    max_concurrent_tasks: 3
    quality_standards:
      - wcag_2_1_aa_compliance
      - material_design_3_guidelines
      - performance_under_16ms
      - accessibility_score_100
    assigned_modules:
      - core_design_theme
      - ui_components
      - animation_system
      - responsive_layouts
    constraints:
      - no_console_logging
      - memory_optimization_required
      - battery_efficient_animations

  # 2. Android Compose AI Specialist
  - name: android-compose-ai-specialist
    type: compose_specialist
    description: "Expert in Jetpack Compose, state management, and architecture"
    capabilities:
      - compose_ui
      - state_management
      - navigation
      - architecture_patterns
      - mvvm_pattern
      - dependency_injection
      - compose_performance
    max_concurrent_tasks: 3
    quality_standards:
      - 100_type_coverage
      - zero_compose_errors
      - optimal_recomposition
      - memory_efficient
    assigned_modules:
      - compose_navigation
      - state_management
      - viewmodel_implementation
      - dependency_injection
    constraints:
      - hilt_di_required
      - mvvm_pattern_only
      - no_state_hoisting_issues

  # 3. ML Computer Vision Architect
  - name: ml-computer-vision-architect
    type: ml_architect
    description: "AI/ML expert specializing in computer vision and TensorFlow Lite"
    capabilities:
      - tensorflow_lite
      - computer_vision
      - on_device_ml
      - model_optimization
      - image_processing
      - ai_validation
      - phi_3_5_integration
    max_concurrent_tasks: 2
    quality_standards:
      - inference_under_100ms
      - 95_accuracy_minimum
      - model_size_under_50mb
      - memory_efficient
    assigned_modules:
      - ai_model_integration
      - computer_vision_pipeline
      - ont_light_detection
      - image_analysis
    constraints:
      - on_device_processing
      - battery_optimized_ml
      - real_time_validation

  # 4. Camera Workflow Engineer
  - name: camera-workflow-engineer
    type: camera_engineer
    description: "CameraX and photo workflow specialist"
    capabilities:
      - camerax_integration
      - photo_capture
      - workflow_management
      - image_quality
      - real_time_preview
      - permission_handling
      - image_processing
    max_concurrent_tasks: 2
    quality_standards:
      - capture_under_500ms
      - 99_reliability
      - high_quality_images
      - error_recovery
    assigned_modules:
      - camera_system
      - photo_workflow
      - image_capture
      - real_time_validation
    constraints:
      - permission_aware
      - error_resilient
      - offline_capable

  # 5. Offline-First Database Expert
  - name: offline-first-database-expert
    type: database_expert
    description: "Room database expert with offline synchronization"
    capabilities:
      - room_database
      - sqlcipher_encryption
      - data_synchronization
      - offline_first
      - database_optimization
      - data_migration
      - backup_recovery
    max_concurrent_tasks: 2
    quality_standards:
      - acid_compliance
      - end_to_end_encryption
      - sync_under_1s
      - data_integrity
    assigned_modules:
      - database_schema
      - data_sync
      - encryption_system
      - offline_storage
    constraints:
      - encrypted_storage
      - efficient_syncing
      - data_compression

  # 6. Biometric Security Architect
  - name: biometric-security-architect
    type: security_architect
    description: "Security and biometric authentication specialist"
    capabilities:
      - biometric_authentication
      - data_encryption
      - security_auditing
      - certificate_pinning
      - secure_storage
      - penetration_testing
      - compliance
    max_concurrent_tasks: 2
    quality_standards:
      - zero_vulnerabilities
      - fido_compliance
      - secure_by_default
      - audit_trail
    assigned_modules:
      - authentication_system
      - security_framework
      - encryption_system
      - audit_logging
    constraints:
      - security_first
      - compliance_required
      - zero_tolerance_policy

  # 7. Android Performance Optimization Expert
  - name: android-performance-optimization-expert
    type: performance_expert
    description: "Performance, battery, and memory optimization specialist"
    capabilities:
      - performance_tuning
      - battery_optimization
      - memory_management
      - startup_optimization
      - background_tasks
      - thermal_management
      - performance_monitoring
    max_concurrent_tasks: 2
    quality_standards:
      - startup_under_1.5s
      - battery_under_15_percent
      - memory_under_500mb
      - ui_responsive
    assigned_modules:
      - performance_monitoring
      - battery_optimization
      - memory_management
      - startup_optimization
    constraints:
      - performance_critical
      - battery_aware
      - memory_efficient

  # 8. Android Testing Specialist
  - name: android-testing-specialist
    type: testing_specialist
    description: "Comprehensive testing and quality assurance expert"
    capabilities:
      - unit_testing
      - integration_testing
      - ui_testing
      - performance_testing
      - security_testing
      - accessibility_testing
      - test_automation
    max_concurrent_tasks: 3
    quality_standards:
      - 95_coverage_minimum
      - zero_critical_bugs
      - automated_testing
      - quality_gates
    assigned_modules:
      - test_framework
      - ui_testing
      - performance_testing
      - accessibility_testing
    constraints:
      - comprehensive_coverage
      - automated_only
      - quality_enforcement

# Global Configuration
global_config:
  # Quality Gates
  quality_gates:
    test_coverage_minimum: 95
    performance_targets:
      startup_time_ms: 1500
      api_response_time_ms: 200
      ui_thread_time_ms: 16
    memory_limits:
      peak_usage_mb: 500
      background_mb: 50
    battery_limits:
      hourly_percentage: 15
      daily_percentage: 40

  # Parallel Execution Limits
  execution_limits:
    max_concurrent_agents: 8
    max_concurrent_tasks: 16
    task_timeout_minutes: 120
    agent_cooldown_seconds: 30

  # Validation Rules
  validation_rules:
    require_tests_before_implementation: true
    zero_compilation_errors: true
    no_console_logging: true
    accessibility_required: true
    performance_optimization_required: true
    security_review_required: true

  # Reporting
  reporting:
    progress_interval_seconds: 10
    quality_check_interval_minutes: 30
    auto_backup_interval_minutes: 60
    alert_thresholds:
      quality_score: 0.8
      failure_rate: 0.1
      performance_degradation: 0.2